kind = "web"
previewPath = "/"
title = "Telegram Group Manager"
version = "1.0.0"
id = "artifacts/tg-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20141

[services.development]
run = "pnpm --filter @workspace/tg-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tg-dashboard", "run", "build" ]
publicDir = "artifacts/tg-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20141"
BASE_PATH = "/"
